name: Foundry module checks

on:
  push:
    branches: [main]
    paths: ["foundry/**", ".github/workflows/foundry-module-tests.yml"]
  pull_request:
    paths: ["foundry/**", ".github/workflows/foundry-module-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test manual tools, enhancement filters, native document changes and bundled assets
        run: node --test --test-reporter=spec foundry/tests/*.test.mjs
      - name: Test both module installations and upgrade preservation
        shell: pwsh
        run: ./foundry/tests/install.test.ps1
      - name: Check model research tools without downloading candidate weights
        run: |
          node --check foundry/tests/serve-harness.mjs
          node --check foundry/tests/enhancer-comparison.mjs
          node --check foundry/tests/enhancer-trial-worker.mjs
          python3 -m py_compile foundry/tools/prepare-anime-trials.py
          python3 -m json.tool foundry/tools/anime-trials.json > /dev/null
          python3 -m json.tool foundry/tests/model-trial-results.json > /dev/null
