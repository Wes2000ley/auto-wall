name: Structure model checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "fast_auto_wall.py"
      - "scripts/**"
      - "benchmarks/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/structure-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "fast_auto_wall.py"
      - "scripts/**"
      - "benchmarks/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/structure-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0
      - name: Install CPU test dependencies
        run: |
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-fast.txt -r requirements-ml-dino.txt requests pillow scikit-learn pytest
      - name: Test models, annotations, geometry, and editor
        run: >-
          python -B -m pytest -q
          tests/test_ml.py tests/test_ml_dino.py tests/test_ml_lights.py
          tests/test_ml_teacher.py tests/test_ml_runtime_queue.py
          tests/test_ml_pipeline.py tests/test_structure_metrics.py
          tests/test_fast_pipeline.py
          tests/test_encounter_corpus.py tests/test_encounter_training.py
          tests/test_foundry_export.py tests/test_fast_setup.py
          tests/test_wall_editing.py tests/test_editor_integration.py
